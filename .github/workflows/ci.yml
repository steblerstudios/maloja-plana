name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Kleinstmögliche Rechte für das GITHUB_TOKEN (Voll-Review 15.09.2026): der Lauf liest nur.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci bindet den Lauf an das Lockfile (Bau-Liste K15). Der erste Versuch (#134)
      # scheiterte, weil npm 10 (hier: Node 22) für den optionalen Peer esbuild@^0.28 von
      # vite 8 (unter vitest) einen Eintrag im Lockfile erwartet, den npm 11 nicht schreibt.
      # Das Lockfile ist darum mit npm 10 erneuert; npm 10 und 11 installieren es beide.
      # Nach Paket-Änderungen: `npx npm@10 install --package-lock-only`, sonst bricht CI hier.
      - run: npm ci

      - run: npm test -- --run

      # PII-Scan mit den generischen Mustern (private Mails, Home-Pfade mit echtem
      # Benutzernamen, Klient-Hashes) — die geben nie Fehlalarm. Namen/projekt-
      # spezifische Tokens prüft das Deploy-Gate (deploy.sh fährt denselben Scan
      # mit der lokalen, geprüften .pii-deny.txt, BEVOR etwas live geht). Bewusst
      # KEIN Secret in CI: eine per-Zeile gepflegte Deny-Liste driftet und erzeugt
      # Fehlalarme (Nachname↔Marke, Streu-Einträge) — 2026-07-14 gelernt.
      - name: PII-Scan (Mails/Home-Pfade/Hashes in getrackten Dateien)
        run: bash scripts/pii-scan.sh

      - run: npm run build

      - run: npm run size
