name: Deploy to Infomaniak

# Baut die statische App und lädt den Inhalt von dist/ per SFTP zu Infomaniak
# (malojaplana.ch).
#
# SFTP-Host: [entfernt].ftp.infomaniak.com (Port 22, SSH für [entfernt]_admin aktiviert).
# NICHT ftp.hosting-ik.com — der ist von aussen auf 21/22 nicht erreichbar.
# Auto-Trigger (push) ist noch auskommentiert: erst ein kontrollierter manueller
# Lauf (workflow_dispatch) zum Verifizieren, dann push-Trigger reaktivieren.
#
# Benötigte GitHub-Secrets (Repo → Settings → Secrets and variables → Actions):
#   FTP_USERNAME  – FTP-Benutzername von Infomaniak
#   FTP_PASSWORD  – FTP-Passwort
# Upload via SFTP (Port 22). Zielpfad absolut, unten gesetzt.
# Kein BASE_URL nötig: base default '/' passt für die Root-Domain.
# WICHTIG: public/.htaccess wird beim Build nach dist/ kopiert, verursacht auf
# Infomaniak aber einen 503 → wird vor dem Upload entfernt (Schritt unten).
# Security-Header laufen übers Infomaniak-Panel; die App nutzt Hash-Routing
# (#/…) und braucht keine Server-Rewrites.

on:
  # push:                 # reaktivieren, sobald der SSH/SFTP-Host geklärt ist
  #   branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TEMP-Diagnose: kann der Runner den SSH-Host überhaupt per TCP erreichen?
      - name: Diagnose SSH-Erreichbarkeit
        run: |
          echo "TCP-Connect-Test [entfernt].ftp.infomaniak.com:22 vom GitHub-Runner:"
          timeout 15 bash -c 'exec 3<>/dev/tcp/[entfernt].ftp.infomaniak.com/22 && head -c 50 <&3' \
            && echo "" && echo "→ ERREICHBAR (SSH-Banner oben sichtbar)" \
            || echo "→ BLOCKIERT / Timeout (Infomaniak filtert die Runner-IP)"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run build

      # Infomaniak liefert 503, wenn ein .htaccess vorhanden ist → vor dem Upload entfernen.
      - run: rm -f dist/.htaccess

      # Deploy via SFTP (Port 22) mit lftp. FTP (Port 21) ist von GitHub-Runnern
      # aus nicht erreichbar (Infomaniak blockt FTP von CI-IPs); SFTP über SSH geht.
      # mirror -R = Inhalt von dist/ hochladen. Ohne --delete bleibt es
      # nicht-destruktiv (lftp löscht standardmässig keine Server-Dateien).
      # Robustheit: max-retries/timeout verhindern den Endlos-Retry-Hänger
      # (lftp-Default = unendlich), parallel-transfer-count beschleunigt den Upload.
      - name: Deploy to Infomaniak via SFTP
        env:
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 20; set net:reconnect-interval-base 5; set mirror:parallel-transfer-count 4; open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://[entfernt].ftp.infomaniak.com; mirror -R --verbose ./dist/ /home/clients/c6c3e5438c4705c1cdcb2a0bc0130c62/sites/malojaplana.ch/"
