<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect x="24" y="24" width="208" height="208" rx="48" fill="#F4F0EA"/>
  <!-- Safe body -->
  <rect x="64" y="68" width="128" height="112" rx="12" fill="#5F5A54"/>
  <!-- Safe door edge -->
  <rect x="72" y="76" width="112" height="96" rx="8" fill="#5F5A54" stroke="#D9C49A" stroke-width="2"/>
  <!-- Circular dial/handle -->
  <circle cx="128" cy="124" r="22" fill="none" stroke="#D9C49A" stroke-width="3"/>
  <circle cx="128" cy="124" r="6" fill="#D9C49A"/>
  <!-- Dial marks -->
  <line x1="128" y1="105" x2="128" y2="108" stroke="#D9C49A" stroke-width="2"/>
  <line x1="128" y1="140" x2="128" y2="143" stroke="#D9C49A" stroke-width="2"/>
  <line x1="109" y1="124" x2="112" y2="124" stroke="#D9C49A" stroke-width="2"/>
  <line x1="144" y1="124" x2="147" y2="124" stroke="#D9C49A" stroke-width="2"/>
  <!-- Handle bar -->
  <rect x="160" y="118" width="16" height="12" rx="3" fill="#D9C49A"/>
  <!-- Small document peeking out -->
  <g transform="translate(170,70)">
    <rect x="0" y="0" width="24" height="30" rx="3" fill="#F4F0EA" stroke="#D9C49A" stroke-width="1.5"/>
    <line x1="5" y1="8" x2="19" y2="8" stroke="#D9C49A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="14" x2="19" y2="14" stroke="#D9C49A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="20" x2="14" y2="20" stroke="#D9C49A" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>