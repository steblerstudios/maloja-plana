<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect x="24" y="24" width="208" height="208" rx="48" fill="#F4F0EA"/>
  <!-- Small Chalet -->
  <polygon points="108,72 60,108 156,108" fill="#8EAD9F"/>
  <rect x="72" y="108" width="72" height="56" fill="#8EAD9F" opacity="0.7"/>
  <!-- Window -->
  <rect x="92" y="120" width="20" height="16" rx="2" fill="#F4F0EA"/>
  <!-- Door -->
  <rect x="116" y="128" width="16" height="20" rx="2" fill="#5F5A54" opacity="0.5"/>
  <!-- Foundation -->
  <line x1="64" y1="164" x2="152" y2="164" stroke="#5F5A54" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Coin with down arrow (Miete wird günstiger) -->
  <circle cx="180" cy="168" r="26" fill="#C29A63"/>
  <text x="180" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#FFFFFF">CHF</text>
  <!-- Down arrow -->
  <path d="M170,172 L180,184 L190,172" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="180" y1="160" x2="180" y2="184" stroke="#FFFFFF" stroke-width="0" opacity="0"/>
</svg>