<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect x="24" y="24" width="208" height="208" rx="48" fill="#F4F0EA"/>
  <!-- Clock face - Bahnhofsuhr inspired -->
  <circle cx="128" cy="128" r="68" fill="none" stroke="#5F5A54" stroke-width="5"/>
  <circle cx="128" cy="128" r="62" fill="none" stroke="#5F5A54" stroke-width="1.5"/>
  <!-- Hour markers -->
  <line x1="128" y1="70" x2="128" y2="80" stroke="#5F5A54" stroke-width="4" stroke-linecap="round"/>
  <line x1="128" y1="176" x2="128" y2="186" stroke="#5F5A54" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="128" x2="80" y2="128" stroke="#5F5A54" stroke-width="4" stroke-linecap="round"/>
  <line x1="176" y1="128" x2="186" y2="128" stroke="#5F5A54" stroke-width="4" stroke-linecap="round"/>
  <!-- Smaller hour markers -->
  <line x1="156" y1="73" x2="152" y2="80" stroke="#5F5A54" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="179" y1="100" x2="172" y2="104" stroke="#5F5A54" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="179" y1="156" x2="172" y2="152" stroke="#5F5A54" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="156" y1="183" x2="152" y2="176" stroke="#5F5A54" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="183" x2="104" y2="176" stroke="#5F5A54" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="77" y1="156" x2="84" y2="152" stroke="#5F5A54" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="77" y1="100" x2="84" y2="104" stroke="#5F5A54" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="73" x2="104" y2="80" stroke="#5F5A54" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hour hand (pointing ~10:10) -->
  <line x1="128" y1="128" x2="110" y2="92" stroke="#5F5A54" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="128" y1="128" x2="152" y2="88" stroke="#5F5A54" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Second hand with red dot - Mondaine inspired -->
  <line x1="128" y1="128" x2="128" y2="158" stroke="#D84A3A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="128" cy="158" r="5" fill="#D84A3A"/>
  <!-- Center dot -->
  <circle cx="128" cy="128" r="4" fill="#5F5A54"/>
</svg>