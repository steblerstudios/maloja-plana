<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Seite nicht gefunden — Maloja Plana</title>
  <!-- Gruppe E (11.11.2026), Inhalt und Sprache: Sie-Form statt «deines», klarer Satz, vier Sprachen mit lang,
       Schrift Lexend vom eigenen Server (vorher 'DM Sans' ohne @font-face, nie geladen), Leise-Ton #575B61
       (6,83:1 auf Weiss), Link unterstrichen und 44 px hoch. Gestaltung nach dem Rahmen der Erklärseiten
       (Dunkelmodus, Kopf, Fuss) ist ein eigener Entscheid, Gruppe E Gestaltung A. -->
  <style>
    @font-face{ font-family:'Lexend'; src:url('/fonts/lexend-latin-400-normal.woff2') format('woff2');
      font-weight:400; font-display:swap }
    @font-face{ font-family:'Lexend'; src:url('/fonts/lexend-latin-500-normal.woff2') format('woff2');
      font-weight:500; font-display:swap }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #F8F7F5;
      color: #2C2A26;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      text-align: center;
      background: #fff;
      border: 1px solid #E0DDD8;
      border-radius: 12px;
      padding: 48px 32px;
    }
    h1 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #575B61;
      line-height: 1.6;
    }
    .lead { margin-bottom: 24px; }
    a {
      display: inline-block;
      min-height: 44px;
      line-height: 44px;
      font-size: 15px;
      color: #2C2A26;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a:hover { text-decoration-thickness: 2px; }
    .langs {
      font-size: 13px;
      line-height: 1.7;
      border-top: 1px solid #EFEDEA;
      margin-top: 20px;
      padding-top: 20px;
    }
    .langs span { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Maloja Plana</h1>
    <p class="lead">Diese Adresse gibt es nicht. Vielleicht wurde die Seite verschoben.</p>
    <a href="/">Zur Startseite</a>
    <!-- RM folgt mit der Muttersprachler-Gegenlese, wie auf der Wartungsseite. -->
    <p class="langs">
      <span lang="fr">Cette adresse n’existe pas. La page a peut-être été déplacée.</span>
      <span lang="it">Questo indirizzo non esiste. Forse la pagina è stata spostata.</span>
      <span lang="en">This address does not exist. The page may have moved.</span>
    </p>
  </main>
</body>
</html>
