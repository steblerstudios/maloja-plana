<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Seite nicht gefunden — Maloja Plana</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #F8F7F5;
      color: #2C2A26;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      text-align: center;
      background: #fff;
      border: 1px solid #E0DDD8;
      border-radius: 12px;
      padding: 48px 32px;
    }
    h1 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }
    p {
      font-size: 15px;
      color: #7A7670;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    a {
      display: inline-block;
      font-size: 14px;
      color: #7A7670;
      text-decoration: none;
      border-bottom: 1px solid #E0DDD8;
      padding-bottom: 1px;
      transition: color 0.2s;
    }
    a:hover { color: #2C2A26; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Maloja Plana</h1>
    <p>Diese Seite ist nicht Teil deines Lebensordners.</p>
    <a href="/">Zur Startseite</a>
  </div>
</body>
</html>
