<h1>Icon Finetuning</h1>
<div class="subtitle">Maloja Plana — Finanzen, Behoerden, Wohnen</div>

<!-- ═══ FINANZEN ═══ -->
<div class="icon-section">
  <h2>Finanzen</h2>
  <div class="icon-meta">Schweizer 5-Franken-Muenze (Fuenfliber) — viewBox 0 0 48 48</div>
  <div class="theme-rows" id="rows-finanzen"></div>
</div>

<hr class="divider">

<!-- ═══ BEHOERDEN ═══ -->
<div class="icon-section">
  <h2>Behoerden</h2>
  <div class="icon-meta">Helvetia-Allegorie, Bundesdesign — viewBox 0 0 48 48</div>
  <div class="theme-rows" id="rows-behoerden"></div>
</div>

<hr class="divider">

<!-- ═══ WOHNEN ═══ -->
<div class="icon-section">
  <h2>Wohnen</h2>
  <div class="icon-meta">Schweizer Chalet, Berner Oberland — viewBox 0 0 24 24</div>
  <div class="theme-rows" id="rows-wohnen"></div>
</div>

</div>

<script>
  var themes = [
    { label: 'Hell',   bg: '#F7F4EF', color: '#5C564F', border: '#E5E0D8' },
    { label: 'Dunkel', bg: '#2C2A26', color: '#D4CFC6', border: '#3E3B36' },
    { label: 'Akzent', bg: '#4A7C6F', color: '#E8F0ED', border: '#3D6B5F' },
  ];
  var icons = [
    { id: 'finanzen',  sizes: [48, 96, 192, 320] },
    { id: 'behoerden', sizes: [48, 96, 192, 320] },
    { id: 'wohnen',    sizes: [24, 48, 96, 192] },
  ];

  icons.forEach(function(icon) {
    var container = document.getElementById('rows-' + icon.id);
    var html = '';
    themes.forEach(function(t) {
      html += '<div class="theme-row">';
      html += '<div class="theme-label">' + t.label + '</div>';
      html += '<div class="size-row">';
      icon.sizes.forEach(function(sz) {
        var pad = Math.max(8, Math.round(sz * 0.12));
        var box = sz + pad * 2;
        html += '<div class="size-cell">';
        html += '<div class="icon-box" style="width:' + box + 'px;height:' + box + 'px;padding:' + pad + 'px;background:' + t.bg + ';color:' + t.color + ';border:1px solid ' + t.border + ';border-radius:6px;display:flex;align-items:center;justify-content:center">';
        html += '<svg width="' + sz + '" height="' + sz + '"><use href="#icon-' + icon.id + '"/></svg>';
        html += '</div>';
        html += '<div class="size-label">' + sz + 'px</div>';
        html += '</div>';
      });
      html += '</div></div>';
    });
    container.innerHTML = html;
  });
</script>
