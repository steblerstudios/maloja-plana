       1. #root darf keinen Platz belegen. Gemessen am 20.09.2026: #root ist per
          CSS height:100% = volle Bildschirmhöhe und bleibt leer, wenn React nie
          startet — der Kern-Text dahinter begann dadurch exakt eine
          Bildschirmhöhe unter der Kante (y=768 bei 768 px Höhe). Wer ohne

       beide gleich). Danach deckt die App-Fläche alles ab. */
    :root[data-theme="dark"]  { background: #22211F; color-scheme: dark; }
    :root[data-theme="light"] { background: #F2F2F0; color-scheme: light; }

      -webkit-font-smoothing: antialiased;

      font-kerning: normal;
    }
    @media (max-width: 480px) {
      .mountain-label { display: none; }
    }
    /* Kern-Text ohne JavaScript (SEO-Audit 20.09.2026, Massnahme B).
       Hier nur Satz und Rhythmus — die FARBEN stehen im <noscript>-Stilblock im
       <head>, weil sie nur ohne JavaScript überhaupt eine Rolle spielen.
       Eigene Klasse statt Inline-Stil, weil Inline kein @media kennt. */
    .kern-text {
      max-width: 640px; margin: 0 auto; padding: 48px 24px 64px;
      font-family: 'Lexend', sans-serif; text-align: left; line-height: 1.6;

    .kern-text ul { margin: 0 0 12px 20px; }
    .kern-text li { margin-bottom: 6px; }
    .kern-text .leise { font-size: 14px; }
  </style>

      <h1>Maloja Plana</h1>
      <p><strong>Ein ruhiger Überblick über das Leben in der Schweiz — lokal gespeichert,
      offline-fähig, kostenlos.</strong></p>

      <p>Maloja Plana ist ein <strong>Schweizer Lebensordner</strong>. Er hilft Menschen in
      der Schweiz zu verstehen, was ihnen zusteht und was als Nächstes ansteht — von Steuern
      über Prämienverbilligung und Sozialhilfe bis zur Notfallkarte. In fünf Sprachen
      (Deutsch, Français, Italiano, Rumantsch — provisorisch, English), ohne Konto.</p>

      <h2>Was darin steckt</h2>
      <ul>
        <li><strong>Steuern</strong> — Bundes- und Kantonssteuer als Orientierung, auf Basis
        der Tarife der Eidgenössischen Steuerverwaltung.</li>
        <li><strong>Prämienverbilligung (IPV)</strong> — eine Orientierung, ob sich ein Antrag
        lohnt. Jeder Kanton rechnet anders; die App rechnet kantonal.</li>
        <li><strong>Sozialhilfe und Ergänzungsleistungen</strong> — eine Orientierung nach den
        SKOS-Richtlinien, inklusive kantonaler Vermögensfreibeträge.</li>
        <li><strong>Mindestlohn</strong> — ob der eigene Stundenlohn den kantonalen Mindestlohn
        erreicht, mit Verweis auf die zuständige Rechtsstelle.</li>
        <li><strong>Vorsorge</strong> — AHV-Referenzalter und ein ruhiger Blick auf später.</li>
        <li><strong>Notfallkarte</strong> — die wichtigsten Angaben zum Ausdrucken, als QR-Code
        auch ohne Internet lesbar.</li>
        <li><strong>Dokumente und Budget</strong> — an einem Ort, nach Lebensbereichen geordnet.</li>
      </ul>

      <h2>Warum es keinen Server gibt</h2>
      <p>Alle Angaben bleiben auf dem Gerät (localStorage und IndexedDB). Kein Konto, kein
      Tracking, keine Werbung, keine Weitergabe an Dritte. Nach dem ersten Laden funktioniert
      die Anwendung auch offline — in der Regel in den Bereichen, die schon einmal geöffnet
      wurden. Der Quellcode ist offen
      (<a href="https://github.com/steblerstudios/maloja-plana">AGPL-3.0</a>).</p>

      <h2>Was es nicht ist</h2>
      <p>Die Rechner und Übersichten sind <strong>Orientierungshilfen auf Basis öffentlicher
      Daten — keine Rechts- oder Finanzberatung</strong>. Der tatsächliche Anspruch wird von
      der zuständigen Stelle geprüft; verbindlich ist immer deren Verfügung.</p>

      <p class="leise">Maloja Plana ist in einer geschlossenen Beta und braucht zurzeit einen
      Zugangscode. Die Anwendung selbst benötigt JavaScript — bitte aktivieren Sie JavaScript
      in den Browser-Einstellungen.</p>
      <p class="leise">Stebler Studios · Basel · info@malojaplana.ch</p>

      <p class="leise" lang="en">This page needs JavaScript to run the app. Maloja Plana is a

      minimum wage, pension, emergency card. All data stays on your device: no account, no
      server, no tracking. Free and open source. Currently in closed beta.</p>
