name: Maintenance Reminder

on:
  schedule:
    # Quartals-Erinnerung: 1. März, Juni, September, Dezember um 09:00 UTC
    - cron: '0 9 1 3,6,9,12 *'
    # Januar-Erinnerung (Datenquellen-Update): 5. Januar um 09:00 UTC
    - cron: '0 9 5 1 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine reminder type
        id: type
        run: |
          MONTH=$(date +%-m)
          if [ "$MONTH" = "1" ]; then
            echo "type=january" >> $GITHUB_OUTPUT
            echo "title=Wartung Januar: Datenquellen-Update + Quartals-Check" >> $GITHUB_OUTPUT
          else
            echo "type=quarterly" >> $GITHUB_OUTPUT
            echo "title=Wartung Q$(( (MONTH - 1) / 3 + 1 )): Quartals-Check" >> $GITHUB_OUTPUT
          fi

      - name: Create maintenance issue (January)
        if: steps.type.outputs.type == 'january'
        run: |
          gh issue create \
            --title "${{ steps.type.outputs.title }}" \
            --label "maintenance,priority:high" \
            --body "$(cat <<'BODY'
          ## Datenquellen-Update (Priorität: hoch)

          Quelle | Prüfen | Datei
          ---|---|---
          BAG Prämien | priminfo.admin.ch | `src/data/praemienDetail.js`
          BVG-Grenzwerte | bsv.admin.ch | `src/VorsorgeRechner.jsx`
          3a-Maximum | bsv.admin.ch | `src/VorsorgeRechner.jsx`, `src/TaxCalculator.jsx`
          EO-Taggeld | bsv.admin.ch | `src/EOrechner.jsx`
          Bundessteuer | estv.admin.ch | `src/TaxCalculator.jsx`
          SKOS Grundbedarf | skos.ch | `src/data/sozialhilfeRechner.js`
          BFS Medianlöhne | bfs.admin.ch (alle 2 Jahre) | `src/data/branchenLohn.js`
          IPV-Modelle | ch.ch | `src/premiumCalc.js`

          ## Quartals-Check

          - [ ] `npm audit` — Sicherheitslücken?
          - [ ] Vite/React Updates verfügbar?
          - [ ] 5 zufällige Links aus `direktLinks.js` prüfen
          - [ ] `npm run build` — kein Chunk > 300KB?
          - [ ] CI/Deploy grün?
          - [ ] Bundle-Grösse dokumentieren

          ## Datenquellen-Versionsregister aktualisieren

          Nach Abschluss: `docs/operations/maintenance-calendar.md` → Tabelle "Datenquellen-Versionsregister" updaten.

          ---
          📋 Wartungskalender: `docs/operations/maintenance-calendar.md`
          🤖 Claude-Prompt: `docs/operations/maintenance-prompt.md`
          BODY
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create maintenance issue (Quarterly)
        if: steps.type.outputs.type == 'quarterly'
        run: |
          gh issue create \
            --title "${{ steps.type.outputs.title }}" \
            --label "maintenance" \
            --body "$(cat <<'BODY'
          ## Quartals-Check

          - [ ] `npm audit` — Sicherheitslücken?
          - [ ] Vite/React Updates verfügbar?
          - [ ] 5 zufällige Links aus `direktLinks.js` prüfen
          - [ ] `npm run build` — kein Chunk > 300KB?
          - [ ] CI/Deploy grün?
          - [ ] Bundle-Grösse dokumentieren

          ---
          📋 Wartungskalender: `docs/operations/maintenance-calendar.md`
          🤖 Claude-Prompt: `docs/operations/maintenance-prompt.md`
          BODY
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send email notification
        run: |
          # GitHub Issues notifiziert automatisch alle Repo-Watcher.
          # Für direkte E-Mail an info@steblerstudios.ch:
          # 1. GitHub → Settings → Notifications → Custom routing für dieses Repo
          # 2. Oder: GitHub Actions Notification mit SendGrid/Mailgun (Secret nötig)
          echo "✅ Maintenance issue created. GitHub notification sent to repo watchers."
          echo ""
          echo "💡 Für E-Mail an info@steblerstudios.ch:"
          echo "   → GitHub Settings → Notifications → Custom routing"
          echo "   → Oder: Repo Settings → Watch → All Activity"
