name: Deploy to Infomaniak

# Baut die statische App und lädt den Inhalt von dist/ per FTPS zu Infomaniak
# (malojaplana.ch). Läuft automatisch bei jedem Push auf dev und kann manuell
# über "Run workflow" (workflow_dispatch) ausgelöst werden.
#
# Benötigte GitHub-Secrets (Repo → Settings → Secrets and variables → Actions):
#   FTP_USERNAME  – FTP-Benutzername von Infomaniak
#   FTP_PASSWORD  – FTP-Passwort
# Der FTP-Server (ftp.hosting-ik.com) und das Zielverzeichnis sind unten gesetzt.
# Kein BASE_URL nötig: base default '/' passt für die Root-Domain.
# Kein .htaccess wird hochgeladen (dist/ enthält keins) — Security-Header laufen
# über das Infomaniak-Panel.

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run build

      - name: Deploy to Infomaniak via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.hosting-ik.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: sites/malojaplana.ch/
