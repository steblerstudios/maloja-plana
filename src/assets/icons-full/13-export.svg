<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect x="24" y="24" width="208" height="208" rx="48" fill="#F4F0EA"/>
  <!-- Swiss army knife / multi-tool silhouette (generisch) -->
  <g transform="translate(128,128) rotate(-30)">
    <!-- Main body -->
    <rect x="-48" y="-14" width="96" height="28" rx="14" fill="#5F5A54"/>
    <!-- Blade extended up-right -->
    <path d="M32,-14 L72,-56 L76,-52 L40,-12" fill="#D9C49A"/>
    <!-- Screwdriver extended down-right -->
    <path d="M32,14 L68,46 L64,50 L28,18" fill="#D9C49A" opacity="0.7"/>
    <!-- Small tool extended up-left -->
    <path d="M-32,-14 L-48,-38 L-44,-40 L-28,-18" fill="#D9C49A" opacity="0.6"/>
    <!-- Hinge/pivot -->
    <circle cx="32" cy="0" r="5" fill="#C29A63"/>
    <circle cx="-32" cy="0" r="4" fill="#C29A63"/>
    <!-- Cross detail on body -->
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#D84A3A" opacity="0.6"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <!-- Export arrow -->
  <g transform="translate(178,178)">
    <line x1="0" y1="0" x2="18" y2="18" stroke="#5F5A54" stroke-width="3" stroke-linecap="round"/>
    <polyline points="8,18 18,18 18,8" fill="none" stroke="#5F5A54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>