name: Deploy to Infomaniak

# Baut die statische App und lädt den Inhalt von dist/ per SFTP zu Infomaniak
# (malojaplana.ch).
#
# SFTP-Host/User/Zielpfad kommen aus Repository-Variablen/Secrets (nicht im Repo).
# Hinweis: Auto-Deploy via CI ist deaktiviert (Infomaniak blockt CI-IPs) — Deploy
# läuft manuell über deploy.sh vom lokalen Rechner.
#
# ⚠️ FUNKTIONIERT NICHT VON GITHUB-HOSTED RUNNERN: Infomaniak filtert SSH/FTP nach
# IP und blockt GitHub-Actions-Rechenzentren (TCP-Connect zu Port 22 läuft vom
# Runner in den Timeout; vom Entwickler-Standort kommt sofort ein SSH-Banner).
# Nicht im Workflow lösbar. Optionen: (a) Infomaniak-IP-Allowlist (GitHub-Ranges
# riesig/rotierend → unpraktisch), (b) Self-hosted Runner mit erlaubter IP,
# (c) Infomaniak-natives Git-Deploy (Panel → Erweiterte Tools), (d) manueller
# Deploy (funktioniert). Auto-Trigger daher aus; Workflow ist startklar, falls
# Variante (a)/(b) je eingerichtet wird.
#
# Benötigte GitHub-Secrets (Repo → Settings → Secrets and variables → Actions):
#   FTP_USERNAME  – FTP-Benutzername von Infomaniak
#   FTP_PASSWORD  – FTP-Passwort
# Upload via SFTP (Port 22). Zielpfad absolut, unten gesetzt.
# Kein BASE_URL nötig: base default '/' passt für die Root-Domain.
# WICHTIG: public/.htaccess wird beim Build nach dist/ kopiert und vor dem Upload
# entfernt (Schritt unten). Die .htaccess auf dem Server wird von Hand gepflegt —
# alle Security-Header kommen aus ihr (belegt 25.09.2026, wie in deploy.sh), nicht
# aus dem Infomaniak-Panel. Der Upload darf sie nie überschreiben. Die App nutzt
# Hash-Routing (#/…) und braucht keine Server-Rewrites.

on:
  # push:                 # reaktivieren, sobald der SSH/SFTP-Host geklärt ist
  #   branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci  # an das Lockfile gebunden (Bau-Liste K15/E27, Begründung in ci.yml)
      - run: npm run build

      # Infomaniak liefert 503, wenn ein .htaccess vorhanden ist → vor dem Upload entfernen.
      - run: rm -f dist/.htaccess

      # Deploy via SFTP (Port 22) mit lftp. FTP (Port 21) ist von GitHub-Runnern
      # aus nicht erreichbar (Infomaniak blockt FTP von CI-IPs); SFTP über SSH geht.
      # mirror -R = Inhalt von dist/ hochladen. Ohne --delete bleibt es
      # nicht-destruktiv (lftp löscht standardmässig keine Server-Dateien).
      # Robustheit: max-retries/timeout verhindern den Endlos-Retry-Hänger
      # (lftp-Default = unendlich), parallel-transfer-count beschleunigt den Upload.
      # Passwort nie im Befehlstext (Voll-Review 15.09.2026): lftp liest es mit
      # --env-password aus LFTP_PASSWORD — dasselbe Muster wie deploy.sh. Host und
      # Zielpfad kommen als Umgebungsvariablen in die Shell, nicht roh interpoliert.
      - name: Deploy to Infomaniak via SFTP
        env:
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_HOST: ${{ vars.SFTP_HOST }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 20; set net:reconnect-interval-base 5; set mirror:parallel-transfer-count 4; open --env-password -u \"$SFTP_USER\" \"sftp://$SFTP_HOST\"; mirror -R --verbose ./dist/ \"$REMOTE_DIR\""
