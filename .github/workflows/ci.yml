name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm test -- --run

      # PII-Scan mit den generischen Mustern (private Mails, Home-Pfade mit echtem
      # Benutzernamen, Klient-Hashes) — die geben nie Fehlalarm. Namen/projekt-
      # spezifische Tokens prüft das Deploy-Gate (deploy.sh fährt denselben Scan
      # mit der lokalen, geprüften .pii-deny.txt, BEVOR etwas live geht). Bewusst
      # KEIN Secret in CI: eine per-Zeile gepflegte Deny-Liste driftet und erzeugt
      # Fehlalarme (Nachname↔Marke, Streu-Einträge) — 2026-07-14 gelernt.
      - name: PII-Scan (Mails/Home-Pfade/Hashes in getrackten Dateien)
        run: bash scripts/pii-scan.sh

      - run: npm run build

      - run: npm run size
