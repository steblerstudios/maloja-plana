  <rect x="112" y="148" width="6" height="6" fill="#5F5A54" opacity="0.5"/>
  <rect x="88" y="160" width="12" height="12" rx="1" fill="#5F5A54" opacity="0.7"/>
  <rect x="104" y="164" width="6" height="6" fill="#5F5A54" opacity="0.5"/>
