name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Kleinstmögliche Rechte für das GITHUB_TOKEN (Voll-Review 15.09.2026): der Lauf liest nur.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Auf feste Commits gepinnt statt @v4 (Sicherheitsprüfung 25.09.2026): ein
      # verschobener Tag kann so nichts Fremdes in den Lauf bringen. Beim Aktualisieren
      # Hash und Kommentar zusammen ändern.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # npm ci bindet den Lauf an das Lockfile (Bau-Liste K15/E27). CI läuft seit E27 auf
      # Node 24 (npm 11) — das Lockfile wird damit erzeugt und erneuert, kein npm-10-Umweg
      # mehr nötig. Nach Paket-Änderungen genügt das lokale `npm install`.
      - run: npm ci

      - run: npm test -- --run

      # PII-Scan mit den generischen Mustern (private Mails, Home-Pfade mit echtem
      # Benutzernamen, Klient-Hashes) — die geben nie Fehlalarm. Namen/projekt-
      # spezifische Tokens prüft das Deploy-Gate (deploy.sh fährt denselben Scan
      # mit der lokalen, geprüften .pii-deny.txt, BEVOR etwas live geht). Bewusst
      # KEIN Secret in CI: eine per-Zeile gepflegte Deny-Liste driftet und erzeugt
      # Fehlalarme (Nachname↔Marke, Streu-Einträge) — 2026-07-14 gelernt.
      # PII_DENY_OPTIONAL=1: der Scan darf hier OHNE die lokale Deny-Liste laufen,
      # sagt das aber laut und behauptet nicht «sauber» (seit 23.09.2026).
      # 🛑 Damit ist klar, was CI leisten kann und was nicht: CI faengt Mails,
      # Home-Pfade und Klient-Hashes — KEINE Vornamen. Das vollstaendige Tor ist
      # der lokale Lauf vor dem Commit.
      - name: PII-Scan (Mails/Home-Pfade/Hashes in getrackten Dateien)
        env:
          PII_DENY_OPTIONAL: "1"
        run: bash scripts/pii-scan.sh

      - run: npm run build

      - run: npm run size
