<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect x="24" y="24" width="208" height="208" rx="48" fill="#F4F0EA"/>
  <!-- Chocolate bar as chart - 4 columns x 3 rows, varying heights -->
  <g transform="translate(64,64)">
    <!-- Base chocolate rectangle -->
    <rect x="0" y="28" width="128" height="100" rx="8" fill="#D9C49A"/>
    <!-- Grid lines (chocolate segments) -->
    <!-- Vertical -->
    <line x1="32" y1="32" x2="32" y2="124" stroke="#C29A63" stroke-width="1.5" opacity="0.5"/>
    <line x1="64" y1="28" x2="64" y2="124" stroke="#C29A63" stroke-width="1.5" opacity="0.5"/>
    <line x1="96" y1="28" x2="96" y2="124" stroke="#C29A63" stroke-width="1.5" opacity="0.5"/>
    <!-- Horizontal -->
    <line x1="4" y1="62" x2="124" y2="62" stroke="#C29A63" stroke-width="1.5" opacity="0.5"/>
    <line x1="4" y1="94" x2="124" y2="94" stroke="#C29A63" stroke-width="1.5" opacity="0.5"/>
    <!-- Bar chart overlay (segments filled to different heights) -->
    <!-- Column 1: 2/3 filled -->
    <rect x="4" y="62" width="26" height="62" rx="2" fill="#8EAD9F" opacity="0.7"/>
    <!-- Column 2: full -->
    <rect x="36" y="32" width="26" height="92" rx="2" fill="#8EAD9F" opacity="0.8"/>
    <!-- Column 3: 1/3 filled -->
    <rect x="68" y="94" width="26" height="30" rx="2" fill="#8EAD9F" opacity="0.6"/>
    <!-- Column 4: 2/3 filled -->
    <rect x="100" y="52" width="24" height="72" rx="2" fill="#8EAD9F" opacity="0.75"/>
    <!-- Broken-off piece top right -->
  </g>
  <!-- Single broken piece floating -->
  <rect x="174" y="56" width="24" height="28" rx="4" fill="#D9C49A" transform="rotate(12,186,70)"/>
</svg>